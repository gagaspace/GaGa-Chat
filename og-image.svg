  <rect x="190" y="300" width="220" height="140" rx="30" fill="#0c181e" stroke="rgba(140,255,150,0.22)" stroke-width="2" />
  <rect x="440" y="300" width="260" height="180" rx="30" fill="#0c181e" stroke="rgba(140,255,150,0.22)" stroke-width="2" />
