<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#061013" />
      <stop offset="40%" stop-color="#0d1e2a" />
      <stop offset="100%" stop-color="#03120f" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8cff94" />
      <stop offset="100%" stop-color="#00d200" />
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="20" result="coloredBlur" />
      <feMerge>
        <feMergeNode in="coloredBlur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bgGradient)" />
  <circle cx="220" cy="160" r="140" fill="rgba(84,255,150,0.18)" />
  <circle cx="980" cy="520" r="120" fill="rgba(0,255,0,0.14)" />
