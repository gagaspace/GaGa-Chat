  <path d="M540 340 h90 a30 30 0 0 1 30 30 v50 a10 10 0 0 1 -10 10 h-60 l-40 30 v-30 h-10 a-30 30 0 0 1 -30 -30 v-50 a30 30 0 0 1 30 -30z" fill="#0e262c" stroke="#84ff96" stroke-width="2" />
  <text x="180" y="180" font-family="'Noto Sans', sans-serif" font-size="68" font-weight="800" fill="#ffffff">GaGa Chat</text>
  <text x="180" y="240" font-family="'Noto Sans', sans-serif" font-size="26" fill="#c4f7c7" opacity="0.95">Live messaging, voice calls, and secure realtime connections.</text>
  <text x="180" y="295" font-family="'Noto Sans', sans-serif" font-size="24" fill="#87ff9a" opacity="0.9">Spark faster conversations with friends and teams.</text>
