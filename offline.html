<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GaGa Chat — Offline</title>
    <meta name="theme-color" content="#000000" />
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: #05070a;
            color: #ffffff;
            font-family: Inter, system-ui, sans-serif;
        }

        .card {
            text-align: center;
            max-width: 420px;
            padding: 2rem;
            border: 1px solid rgba(255, 255, 255, .08);
            border-radius: 24px;
            background: rgba(10, 10, 13, 0.95);
        }

        h1 {
            margin: 0 0 1rem;
            font-size: 1.75rem;
        }

        p {
            margin: 0.75rem 0;
            color: #a1a1aa;
        }

        a {
            color: #00ff7f;
            text-decoration: none;
        }
    </style>
</head>

<body>
    <div class="card">
        <h1>GaGa Chat is offline</h1>
        <p>Your device has lost network connectivity or the app is unavailable. Cached pages are available while
            offline.</p>
        <p><a href="/">Reload app</a> or reconnect to continue.</p>
    </div>
</body>

</html>
